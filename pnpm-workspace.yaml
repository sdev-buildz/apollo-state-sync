allowBuilds:
  esbuild: true
  unrs-resolver: true

packages:
  - '.'
  - 'packages/*'
  - 'e2e/web-app'
  - 'examples/*'

catalog:
  '@apollo/client': '^4.2.12'
  '@pothos/core': '^4.13.1'
  '@stricli/core': '^1.3.0'
  '@types/node': '^26.4.1'
  '@types/react': '^19.2.18'
  '@types/react-dom': '^19.2.7'
  '@typescript/native': 'npm:typescript@^7.0.2'
  '@vitest/ui': '^5.0.0'
  '@vitest/coverage-v8': '^5.0.0'
  'canonical-serialization': '^1.0.0'
  'concurrently': '^10.0.5'
  'graphql': '^17.0.2'
  'graphql-shared-ws': '^1.0.1'
  'graphql-ws': '^6.2.1'
  'graphql-yoga': '^5.21.3'
  'rxjs': '^7.8.2'
  'react': '^19.2.8'
  'react-dom': '^19.2.8'
  'ts-morph': '^28.0.0'
  'ts-strict-utils': '^1.0.0'
  'tsdown': '^0.22.14'
  'tsx': '^4.23.13'
  'typescript': 'npm:@typescript/typescript6@^6.0.2'
  'uWebSockets.js': 'github:uNetworking/uWebSockets.js#v20.70.0'
  'vitest': '^5.0.0'
  'webpack': '^5.110.3'

catalogs:
  peer-deps:
    '@apollo/client': '^4.0.0'

minimumReleaseAgeExclude:
  - graphql-shared-ws@0.0.0
  - ts-strict-utils@1.0.0
  - '@types/react-dom@19.2.7'
  - '@vitest/coverage-v8@5.0.0'
  - '@vitest/mocker@5.0.0'
  - '@vitest/pretty-format@5.0.0'
  - '@vitest/spy@5.0.0'
  - '@vitest/ui@5.0.0'
  - '@vitest/utils@5.0.0'
  - vitest@5.0.0
