allowBuilds:
  esbuild: true
  unrs-resolver: true

packages:
  - '.'
  - 'packages/common-utils'
  - 'packages/migration'
  - 'packages/typedoc-plugins'
  - 'packages/apollo-shared-ws'
  - 'packages/logger'
  - 'e2e/web-app'

catalog:
  '@apollo/client': '^4.0.13'
  '@types/node': '^26.4.1'
  '@stricli/core': '^1.3.0'
  '@typescript/native': 'npm:typescript@^7.0.2'
  'canonical-serialization': '^1.0.0'
  'graphql': '^17.0.2'
  'graphql-shared-ws': '^1.0.1'
  'graphql-ws': '^6.2.1'
  'rxjs': '^7.8.2'
  'ts-morph': '^28.0.0'
  'ts-strict-utils': '^1.0.0'
  'tsdown': '^0.22.14'
  'tsx': '^4.23.13'
  'typescript': 'npm:@typescript/typescript6@^6.0.2'
  'vitest': '^4.1.11'

catalogs:
  peer-deps:
    '@apollo/client': '^4.0.13'

minimumReleaseAgeExclude:
  - graphql-shared-ws@0.0.0
  - ts-strict-utils@1.0.0
  - '@types/react-dom@19.2.7'
